<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#21759b"/>
      <stop offset="100%" stop-color="#135e80"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="88" fill="url(#bg)"/>
  <rect width="512" height="256" rx="88" fill="url(#shine)"/>

  <!-- WP circle logo mark — outer ring -->
  <circle cx="256" cy="216" r="152" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="20"/>

  <!-- Inner ring (WordPress logo has two rings) -->
  <circle cx="256" cy="216" r="118" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>

  <!-- W letterform inside the circle -->
  <text x="256" y="280"
        font-family="'Georgia','Times New Roman',serif"
        font-size="168" font-weight="bold"
        fill="white" text-anchor="middle"
        letter-spacing="-4">W</text>

  <!-- "OFFICIAL" label strip -->
  <rect x="100" y="398" width="312" height="60" rx="30" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <text x="256" y="439"
        font-family="'Arial','Helvetica Neue',sans-serif"
        font-size="30" font-weight="700"
        fill="white" text-anchor="middle"
        letter-spacing="4">OFFICIAL</text>
</svg>
